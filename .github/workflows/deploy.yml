# Builds the static export and publishes it to GitHub Pages.
#
# Requires Settings -> Pages -> Source: "GitHub Actions". With the default
# "Deploy from a branch" setting, Pages serves the repository SOURCE through
# Jekyll — and because a Next.js repo has no index.html at its root, Jekyll
# renders README.md instead of the site. This workflow is what turns the source
# into the static `out/` directory that actually gets served.
#
# Runs on main or master: this repo's default branch is master.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Same gate as `bun run check`, minus the build (done separately below)
      # so a formatting slip fails fast with a clear message.
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

      - run: bun run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
