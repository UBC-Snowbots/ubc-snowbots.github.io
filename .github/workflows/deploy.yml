# Builds the static export and publishes it to GitHub Pages.
#
# This does nothing until the repo has a remote and Pages is enabled
# (Settings -> Pages -> Source: GitHub Actions). See README for the
# www.ubcrover.com custom-domain caveat before you turn it on.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Same gate as `bun run check`, minus the build (done separately below)
      # so a formatting slip fails fast with a clear message.
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

      - run: bun run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
